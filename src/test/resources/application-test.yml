# Profil des tests d'integration : base H2 en memoire (mode MySQL), sans
# taches planifiees pour garder des tests deterministes.
spring:
  datasource:
    url: jdbc:h2:mem:parking_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

parking:
  maintenance:
    enabled: false
