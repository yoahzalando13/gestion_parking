<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Entrees et sorties')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Historique des entrees / sorties</h1>
                <p>Toutes les sessions de stationnement sont conservees.</p>
            </div>
            <div>
                <a class="btn primary" th:href="@{/sessions/entry}">Entree</a>
                <a class="btn" th:href="@{/sessions/exit}">Sortie</a>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form class="filters" method="get" th:action="@{/sessions}">
                <div class="field wide">
                    <label for="search">Recherche (reference, immatriculation, place, client)</label>
                    <input type="text" id="search" name="search" th:value="${search}">
                </div>
                <div class="field">
                    <label for="status">Statut</label>
                    <select id="status" name="status">
                        <option value="">Tous</option>
                        <option th:each="s : ${sessionStatuses}" th:value="${s}" th:text="${s.label}"
                                th:selected="${s == status}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="zone">Zone</label>
                    <select id="zone" name="zone">
                        <option value="">Toutes</option>
                        <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"
                                th:selected="${z == zone}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="sort">Tri</label>
                    <select id="sort" name="sort">
                        <option value="entryTime,desc">Entree (recent)</option>
                        <option value="entryTime,asc">Entree (ancien)</option>
                        <option value="exitTime,desc">Sortie (recent)</option>
                    </select>
                </div>
                <button class="btn primary" type="submit">Filtrer</button>
                <a class="btn" th:href="@{/sessions}">Reinitialiser</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Immatriculation</th>
                        <th>Client</th>
                        <th>Place</th>
                        <th>Entree</th>
                        <th>Sortie</th>
                        <th>Duree</th>
                        <th>Statut</th>
                        <th>Montant</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ps : ${page.content}">
                        <td><a th:href="@{'/sessions/' + ${ps.id()}}" th:text="${ps.reference()}"></a></td>
                        <td><strong th:text="${ps.plateNumber()}"></strong></td>
                        <td th:text="${ps.userName()}"></td>
                        <td th:text="${ps.spaceNumber()} + ' (' + ${ps.zone()} + ')'"></td>
                        <td th:text="${#temporals.format(ps.entryTime(), 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${ps.exitTime()} != null
                                     ? ${#temporals.format(ps.exitTime(), 'dd/MM/yyyy HH:mm')} : '-'"></td>
                        <td th:text="${ps.durationMinutes()} + ' min'"></td>
                        <td><span th:class="'badge ' + ${ps.status().name()}"
                                  th:text="${ps.statusLabel()}"></span></td>
                        <td th:text="${ps.invoice()} != null
                                     ? ${ps.invoice().totalAmount()} + ' ' + ${currency} : '-'"></td>
                        <td>
                            <a class="btn small primary" th:if="${ps.status().name() == 'EN_COURS'}"
                               th:href="@{/sessions/exit(plateNumber=${ps.plateNumber()})}">Sortie</a>
                            <a class="btn small" th:if="${ps.invoice()} != null"
                               sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                               th:href="@{'/invoices/' + ${ps.invoice().id()}}">Facture</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${page.totalElements == 0}">Aucune session trouvee.</div>
            </div>

            <div th:replace="~{fragments/layout :: pager(${page}, '/sessions', ${filterQuery})}"></div>
        </div>
    </main>
</div>
</body>
</html>
